name: Monica
version: "4.1.2-2"
slug: monica
description: Monica 4 personal relationship manager with a bundled MariaDB, built on the official monica:4.1.2-apache image
url: https://github.com/jpcoenen/monica-ha
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
# Stop the add-on while HA makes a backup, so the database files are consistent.
backup: cold
ports:
  80/tcp: 8181
ports_description:
  80/tcp: Monica web interface (point Nginx Proxy Manager here)
watchdog: tcp://[HOST]:[PORT:80]
options:
  app_url: "https://monica.example.com"
  force_url: true
  trusted_proxies: "*"
  disable_signup: true
  mail_mailer: log
schema:
  app_url: url
  force_url: bool
  trusted_proxies: str
  disable_signup: bool
  mail_mailer: list(smtp|log|sendmail)
  mail_host: str?
  mail_port: port?
  mail_username: str?
  mail_password: password?
  mail_encryption: list(tls|ssl)?
  mail_from_address: email?
  mail_from_name: str?
